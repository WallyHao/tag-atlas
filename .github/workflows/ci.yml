name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.1"

      - name: Install dependencies
        run: uv sync --dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest -q

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run Mypy
        run: uv run mypy src

      - name: Check lock file
        run: uv lock --check

      - name: Build wheel
        run: uv build

      - name: Install wheel in clean environment
        run: |
          python -m venv /tmp/tagatlas-wheel-env
          /tmp/tagatlas-wheel-env/bin/pip install --quiet dist/*.whl
          /tmp/tagatlas-wheel-env/bin/python -c "import tagatlas; print(tagatlas.__version__)"
