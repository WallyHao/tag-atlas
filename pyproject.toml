[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tagatlas"
dynamic = ["version"]
description = "Multi-AprilTag 6-DoF spatial localization and pose fusion."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "waliwuao", email = "waliwuao@users.noreply.github.com" },
]
keywords = [
    "apriltag",
    "pose-estimation",
    "localization",
    "slam",
    "robotics",
    "gtsam",
    "factor-graph",
    "computer-vision",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.23",
    "opencv-python>=4.7",
    "gtsam>=4.2,<5",
    "pupil-apriltags>=1.0.4",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/waliwuao/tagatlas"
Repository = "https://github.com/waliwuao/tagatlas"
Issues = "https://github.com/waliwuao/tagatlas/issues"
Documentation = "https://github.com/waliwuao/tagatlas/tree/main/docs"
Changelog = "https://github.com/waliwuao/tagatlas/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tagatlas = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "tagatlas._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
strict_markers = true
addopts = "-ra --cov=tagatlas --cov-branch --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
ignore_missing_imports = true
